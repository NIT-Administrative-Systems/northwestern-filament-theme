name: Check PR

env:
  PHP_VERSION: "8.3"
  NODE_VERSION: "24"
  PNPM_VERSION: "10.x.x"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-format:
    name: Lint, Format & Analyse
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none

      - name: Install Composer Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Rector Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/rector
          key: ${{ runner.os }}-rector-${{ hashFiles('rector.php', 'composer.json') }}
          restore-keys: |
            ${{ runner.os }}-rector-

      - name: Pint Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ./storage/pint.cache
          key: ${{ runner.os }}-pint-${{ hashFiles('pint.json', 'composer.json') }}
          restore-keys: |
            ${{ runner.os }}-pint-

      - name: Run Rector
        run: composer rector:dry

      - name: Run Laravel Pint
        run: composer format:check

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install Node Dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Run Prettier
        run: pnpm format:check

      - name: Run Stylelint
        run: pnpm lint:css

      - name: Check dist/ is up to date
        run: |
          pnpm build
          git diff --exit-code dist/

      - name: PHPStan Result Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/phpstan
          key: phpstan-results-${{ hashFiles('phpstan.neon', 'composer.json') }}
          restore-keys: |
            phpstan-results-${{ hashFiles('phpstan.neon') }}-
            phpstan-results-

      - name: PHPStan
        run: ./vendor/bin/phpstan analyse --no-progress --error-format=checkstyle > phpstan-report.xml

      - name: Publish PHPStan Report
        if: github.actor != 'dependabot[bot]' && always()
        uses: lcollins/checkstyle-github-action@832a70dc40e28517ddb45ac5ac8b2ad1279bd54d # v4.0.0
        with:
          name: "PHPStan Analysis Report"
          path: "phpstan-report.xml"
          title: "PHPStan Analysis Report"

  tests:
    name: Tests — PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} (${{ matrix.stability }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: true
      matrix:
        include:
          - php: "8.3"
            laravel: "12"
            testbench: "10.*"
            stability: "prefer-stable"
          - php: "8.3"
            laravel: "12"
            testbench: "10.*"
            stability: "prefer-lowest"
          - php: "8.4"
            laravel: "12"
            testbench: "10.*"
            stability: "prefer-stable"
          - php: "8.4"
            laravel: "13"
            testbench: "11.*"
            stability: "prefer-stable"
          - php: "8.5"
            laravel: "13"
            testbench: "11.*"
            stability: "prefer-stable"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install Dependencies
        run: |
          composer require "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --no-interaction --prefer-dist --${{ matrix.stability }}

      - name: PHPUnit Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ./.phpunit.cache
          key: ${{ runner.os }}-phpunit-php${{ matrix.php }}-laravel${{ matrix.laravel }}-${{ matrix.stability }}-${{ hashFiles('phpunit.xml', 'composer.json') }}
          restore-keys: |
            ${{ runner.os }}-phpunit-php${{ matrix.php }}-laravel${{ matrix.laravel }}-${{ matrix.stability }}-

      - name: Run Pest
        run: ./vendor/bin/pest --cache-result --cache-directory=.phpunit.cache
