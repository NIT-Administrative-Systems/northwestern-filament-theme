name: Filament Compatibility Check

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-latest:
    name: Check Against Latest Filament ${{ matrix.filament }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        filament: ["^4.0", "^5.0"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.4"
          coverage: none

      - name: Install with Filament ${{ matrix.filament }}
        run: |
          composer require filament/filament:${{ matrix.filament }} --no-interaction --prefer-dist

      - name: Run Selector Integrity Test
        run: ./vendor/bin/pest --filter=FilamentSelectorIntegrity
