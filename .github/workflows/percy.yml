name: Percy Visual Review

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: "8.3"
  NODE_VERSION: "24"
  PNPM_VERSION: "10.x.x"

jobs:
  percy:
    name: Visual Snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none

      - name: Composer Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: demo/vendor
          key: ${{ runner.os }}-demo-composer-${{ hashFiles('demo/composer.lock') }}
          restore-keys: ${{ runner.os }}-demo-composer-

      - name: Install Composer Dependencies
        working-directory: demo
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: demo/pnpm-lock.yaml

      - name: Install Node Dependencies
        working-directory: demo
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Publish Filament Assets
        working-directory: demo
        run: php artisan filament:assets

      - name: Build Vite Assets
        working-directory: demo
        run: pnpm build

      - name: Prepare Environment
        working-directory: demo
        run: |
          cp .env.example .env
          mkdir -p database storage/framework/{cache/data,sessions,views} storage/logs
          touch database/database.sqlite
          php artisan key:generate

      - name: Playwright Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('demo/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-playwright-

      - name: Install Playwright Browsers
        working-directory: demo
        run: pnpm exec playwright install --with-deps chromium

      - name: Configure Percy Browser
        working-directory: demo
        run: |
          browser="$(node -e 'console.log(require("@playwright/test").chromium.executablePath())')"
          test -x "$browser"
          echo "PERCY_BROWSER_EXECUTABLE=$browser" >> "$GITHUB_ENV"

      - name: Run Percy Snapshots
        working-directory: demo
        env:
          PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}
        run: pnpm exec percy exec --allowed-hostname common.northwestern.edu -- pnpm exec playwright test
